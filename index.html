<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raghuvir Scarlett - Shop Directory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #020617;
    color: #fff;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  header { text-align: center; padding: 28px 16px 16px; }
  header h1 { font-size: 28px; font-weight: 800; letter-spacing: 0.03em; }
  header p { color: #fbbf24; font-size: 11px; letter-spacing: 0.25em; margin-top: 6px; font-weight: 700; }

  .search-box { position: relative; margin-bottom: 16px; }
  .search-box svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }
  input[type="text"], input[type="date"] {
    width: 100%;
    background: #fff;
    color: #0f172a;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 600;
    outline: none;
  }
  input::placeholder { color: #94a3b8; }
  input:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.25); }
  #searchInput { padding-left: 46px; font-size: 18px; border-radius: 16px; padding-top: 16px; padding-bottom: 16px; }

  .msg { background: #10b981; color: #fff; font-weight: 700; font-size: 12px; letter-spacing: 0.05em;
    border-radius: 10px; padding: 10px 16px; text-align: center; margin-bottom: 16px; }
  .err { background: #450a0a; color: #fca5a5; border: 2px solid #ef4444; font-weight: 700; font-size: 12px;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }

  .empty { text-align: center; margin-top: 40px; color: #64748b; }
  .empty p.main { font-size: 14px; font-weight: 600; }
  .empty p.sub { font-size: 12px; color: #475569; margin-top: 6px; }

  /* Dashboard boxes */
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .dash-box { background: #0f172a; border: 2px solid #334155; border-radius: 14px; padding: 14px 12px;
    text-align: left; color: #fff; cursor: pointer; font: inherit; }
  .dash-box:hover { border-color: #f59e0b; }
  .dash-box .dash-num { font-size: 26px; font-weight: 800; color: #fbbf24; line-height: 1; }
  .dash-box .dash-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.03em; color: #94a3b8;
    margin-top: 6px; line-height: 1.3; }

  .result-item {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: #0f172a; border: 2px solid #334155; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer; text-align: left;
    color: #fff; font: inherit;
  }
  .result-item:hover { border-color: #f59e0b; }
  .result-item .shop { font-weight: 800; }
  .result-item .firm { color: #94a3b8; font-size: 12px; margin-top: 2px; font-weight: 500; }

  .card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; overflow: hidden; }
  .card-head { background: #1e293b; padding: 16px 20px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid #334155; gap: 12px; }
  .card-head .label { color: #fbbf24; font-size: 11px; letter-spacing: 0.15em; font-weight: 800; }
  .card-head .shopnum { font-size: 24px; font-weight: 800; margin-top: 2px; }
  .shopnum-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .shopnum-chip { background: #0f172a; border: 1px solid #f59e0b; color: #fbbf24; font-size: 13px; font-weight: 800;
    padding: 5px 10px; border-radius: 8px; }
  .update-btn { display: flex; align-items: center; gap: 6px; background: #f59e0b; color: #020617;
    font-weight: 800; font-size: 12px; letter-spacing: 0.03em; padding: 10px 14px; border-radius: 10px;
    border: none; cursor: pointer; flex-shrink: 0; }
  .update-btn:hover { background: #fbbf24; }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px;
    border-bottom: 1px solid #1e293b; }
  .row:last-child { border-bottom: none; }
  .row .k { color: #94a3b8; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
  .row .v { font-weight: 800; font-size: 14px; text-align: right; margin-left: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .pill.yes { background: #052e16; color: #4ade80; }
  .pill.no { background: #450a0a; color: #f87171; }

  .row.phone-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .row.phone-row .top { display: flex; align-items: center; justify-content: space-between; }
  .phone-actions { display: flex; gap: 8px; }
  .phone-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px; border-radius: 9px; font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
    text-decoration: none; border: none; cursor: pointer; }
  .phone-btn.call { background: #1d4ed8; color: #fff; }
  .phone-btn.call:hover { background: #2563eb; }
  .phone-btn.whatsapp { background: #16a34a; color: #fff; }
  .phone-btn.whatsapp:hover { background: #22c55e; }

  .history { margin-top: 16px; }
  .history summary { cursor: pointer; color: #94a3b8; font-size: 12px; font-weight: 800; letter-spacing: 0.05em;
    padding: 12px 4px; list-style: none; display: flex; align-items: center; gap: 6px; }
  .history summary::-webkit-details-marker { display: none; }
  .history-entry { background: #0f172a; border: 1px solid #334155; border-radius: 12px; margin-top: 8px; overflow: hidden; }
  .history-entry .h-head { background: #1e1206; color: #fbbf24; font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
    padding: 10px 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
  .history-entry .h-head .h-title { flex: 1; }
  .h-delete-btn { flex-shrink: 0; background: #ef4444; color: #fff; border: none; border-radius: 6px;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; }
  .h-delete-btn:hover { background: #f87171; }
  .history-entry .h-row { display: flex; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid #1e293b; font-size: 12px; }
  .history-entry .h-row:last-child { border-bottom: none; }
  .history-entry .h-row .k { color: #64748b; font-weight: 700; }
  .history-entry .h-row .v { color: #cbd5e1; font-weight: 700; text-align: right; margin-left: 12px; }

  .fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%;
    background: #f59e0b; color: #020617; border: none; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4); cursor: pointer; }
  .fab:hover { background: #fbbf24; }

  footer { text-align: center; padding: 20px 0; color: #475569; font-size: 10px; letter-spacing: 0.1em; font-weight: 600; }

  #formView, #dashboardView { display: none; min-height: 100vh; padding-bottom: 40px; }
  .form-header { position: sticky; top: 0; background: #020617; border-bottom: 1px solid #334155;
    padding: 16px; display: flex; align-items: center; gap: 12px; z-index: 10; }
  .back-btn { background: none; border: none; color: #cbd5e1; cursor: pointer; display: flex; }
  .back-btn:hover { color: #fff; }
  .form-header h2 { font-size: 16px; font-weight: 800; letter-spacing: 0.02em; }
  .field { margin: 16px 0; }
  .field label { display: block; color: #fbbf24; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; margin-bottom: 6px; }
  .field.muted label { color: #cbd5e1; }
  .field-hint { color: #64748b; font-size: 11px; margin-top: 6px; font-weight: 600; }
  .chip-editor { background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 10px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip-list:empty { margin-bottom: 0; }
  .edit-chip { display: flex; align-items: center; gap: 6px; background: #1e293b; border: 1px solid #f59e0b;
    color: #fbbf24; font-size: 13px; font-weight: 800; padding: 6px 6px 6px 12px; border-radius: 999px; }
  .edit-chip button { background: #f59e0b; color: #020617; border: none; width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; font-weight: 900; line-height: 1; }
  .edit-chip button:hover { background: #fbbf24; }
  #f_shopAdd { border: none; background: transparent; color: #fff; padding: 8px 4px; font-size: 15px; font-weight: 600; }
  #f_shopAdd:focus { outline: none; }
  .bool-row { display: flex; gap: 8px; }
  .bool-btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.02em;
    border: 2px solid #334155; background: #0f172a; color: #94a3b8; cursor: pointer; }
  .bool-btn.active-yes { background: #10b981; border-color: #10b981; color: #fff; }
  .bool-btn.active-no { background: #ef4444; border-color: #ef4444; color: #fff; }
  .save-btn { width: 100%; background: #f59e0b; color: #020617; font-weight: 800; font-size: 15px;
    letter-spacing: 0.03em; padding: 16px; border-radius: 12px; border: none; margin-top: 12px; cursor: pointer; }
  .save-btn:hover { background: #fbbf24; }
  input:disabled { opacity: 0.7; }
  .dash-sub-empty { text-align: center; margin-top: 30px; color: #64748b; font-size: 13px; font-weight: 600; }
  .pdf-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: #dc2626; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.03em;
    padding: 14px; border-radius: 12px; border: none; cursor: pointer; margin: 14px 0; }
  .pdf-btn:hover { background: #ef4444; }
  .pdf-btn:disabled { opacity: 0.6; cursor: default; }

  /* Broker picker */
  .broker-picker { position: relative; }
  .broker-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
    background: #0f172a; border: 2px solid #f59e0b; border-radius: 12px;
    max-height: 260px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .broker-add-row { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid #334155;
    color: #fbbf24; font-weight: 800; font-size: 13px; letter-spacing: 0.02em; cursor: pointer; }
  .broker-add-row:hover { background: #1e293b; }
  .broker-add-row .plus-circle { width: 22px; height: 22px; border-radius: 50%; background: #f59e0b; color: #020617;
    display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; font-size: 14px; }
  .broker-item { padding: 10px 12px; border-bottom: 1px solid #1e293b; cursor: pointer; }
  .broker-item:last-child { border-bottom: none; }
  .broker-item:hover { background: #1e293b; }
  .broker-item .b-name { font-weight: 800; font-size: 13px; color: #fff; }
  .broker-item .b-mobile { font-size: 11px; color: #94a3b8; margin-top: 2px; font-weight: 600; }
  .broker-empty { padding: 14px 12px; color: #64748b; font-size: 12px; font-weight: 600; text-align: center; }
  .broker-newform { padding: 12px; }
  .broker-newform input { width: 100%; margin-bottom: 8px; padding: 10px 12px; font-size: 14px; }
  .broker-newform .bn-actions { display: flex; gap: 8px; }
  .broker-newform .bn-save { flex: 1; background: #10b981; color: #fff; font-weight: 800; border: none;
    border-radius: 8px; padding: 10px; cursor: pointer; font-size: 12px; letter-spacing: 0.02em; }
  .broker-newform .bn-save:hover { background: #34d399; }
  .broker-newform .bn-cancel { flex: 1; background: #334155; color: #fff; font-weight: 800; border: none;
    border-radius: 8px; padding: 10px; cursor: pointer; font-size: 12px; letter-spacing: 0.02em; }
  .broker-newform .bn-cancel:hover { background: #475569; }
</style>

</head>
<body>

  <div class="wrap">
    <header>
      <h1>RAGHUVIR SCARLETT</h1>

    </header>

    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="SEARCH SHOP NUMBER" autocomplete="off">
    </div>

    <div class="dash-grid">
      <button class="dash-box" id="boxPossession">

      </button>
      <button class="dash-box" id="boxAgreement">

    <div id="msgArea"></div>

  <footer>DEVELOPED BY ADITYA VADODE</footer>
</div>

<div id="formView">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7M19 12H5"/></svg>

</div>

  <div class="form-header">
    <button class="back-btn" id="dashBackBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7M19 12H5"/></svg>
    </button>
    <h2 id="dashTitle">POSSESSION EXPIRY</h2>
  </div>
  <div class="wrap">
    <div id="dashActionArea"></div>
    <div id="dashListArea"></div>

<script>
const FIELD_DEFS = [
  { key: "firmName", label: "FIRM NAME", type: "text" },
  { key: "gstNo", label: "GST NO", type: "text" },
  { key: "ownerName", label: "SHOP OWNER NAME", type: "text" },
  { key: "ownerMobile", label: "OWNER MOBILE NUMBER", type: "phone" },
  { key: "rentalName", label: "RENTAL NAME", type: "text" },
  { key: "rentalMobile", label: "RENTAL MOBILE NUMBER", type: "phone" },
  { key: "partnerName", label: "PARTNER NAME", type: "text" },
  { key: "partnerMobile", label: "PARTNER MOBILE NUMBER", type: "phone" },
  { key: "officeManagerNumber", label: "OFFICE MANAGER NUMBER", type: "phone" },
  { key: "brokerName", label: "BROKER NAME", type: "text" },
  { key: "brokerMobile", label: "BROKER MOBILE NUMBER", type: "phone" },
  { key: "possessionDate", label: "POSSESSION DATE", type: "date" },
  { key: "referenceFormStatus", label: "REFERENCE FORM STATUS", type: "bool" },
  { key: "agreementStatus", label: "AGREEMENT STATUS", type: "bool" },
  { key: "shopMaliyaStatus", label: "SHOP MALIYA STATUS", type: "bool" },
  { key: "furnitureStatus", label: "FURNITURE STATUS", type: "bool" },
  { key: "securityDepositStatus", label: "SECURITY DEPOSIT", type: "bool" },
  { key: "veraBillStatus", label: "VERA BILL", type: "bool" },
  { key: "maintenanceBillStatus", label: "MAINTENANCE BILL", type: "bool" },
];

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLl1SCzWSGXzjuziG7s6RMAiE54KEtgL5kZazSPD48i3Y56U3RNdXaysWbF1aW97TI/exec";

// Reserved key inside the same "parties" object used to store the broker list
// (so it persists through the exact same load/save pipeline as everything else).
const BROKERS_KEY = "__brokers__";

// parties is now keyed by an internal partyId (NOT shop number).
// Each party record has: { partyId, shopNumbers: [ "G-101", "G-102", ... ], ...FIELD_DEFS, history: [...] }
// This lets one party (same firm/owner) hold several shop numbers without duplicating data.
let parties = {};
let editingKey = null; // partyId being edited, or null for new
let isSaving = false;
let currentViewKey = null; // shop number currently shown in the card (resolved to a party at render time)
let formShopNumbers = []; // working list of shop numbers while the add/update form is open

const searchView = document.getElementById('searchView');
const formView = document.getElementById('formView');
const dashboardView = document.getElementById('dashboardView');
const searchInput = document.getElementById('searchInput');
const resultArea = document.getElementById('resultArea');
const msgArea = document.getElementById('msgArea');
const countText = document.getElementById('countText');
const partyForm = document.getElementById('partyForm');
const formTitle = document.getElementById('formTitle');
const formErr = document.getElementById('formErr');
const dashTitle = document.getElementById('dashTitle');
const dashActionArea = document.getElementById('dashActionArea');
const dashListArea = document.getElementById('dashListArea');

async function fetchFromSheet() {
  const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
  const data = await res.json();
  return data && typeof data === 'object' ? data : {};
}

async function loadData() {
  try {
    parties = await fetchFromSheet();
    migrateOldDataIfNeeded();
    syncBrokersFromParties();
  } catch (e) {
    console.error('Load failed', e);
  }
  renderSearch();

  setInterval(async () => {
    if (isSaving || formView.style.display === 'block' || dashboardView.style.display === 'block') return;
    try {
      parties = await fetchFromSheet();
      migrateOldDataIfNeeded();
      syncBrokersFromParties();
      renderSearch(currentViewKey || undefined);
    } catch (e) {}
  }, 6000);
}

// Backward compatibility: if old records (single "shopNumber" string, keyed by shop number) are
// still in the sheet, convert them in memory to the new { shopNumbers: [...] } shape so nothing breaks.
function migrateOldDataIfNeeded() {
  let changed = false;
  const migrated = {};
  Object.keys(parties).forEach(key => {
    const rec = parties[key];
    if (rec && !rec.shopNumbers && rec.shopNumber) {
      const newId = generatePartyId();
      migrated[newId] = Object.assign({}, rec, {
        partyId: newId,
        shopNumbers: [rec.shopNumber]
      });
      delete migrated[newId].shopNumber;
      changed = true;
    } else if (rec) {
      if (!rec.partyId) rec.partyId = key;
      migrated[key] = rec;
    }
  });
  parties = migrated;
  if (changed) syncToStorage();
}

function generatePartyId() {
  return 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// All real party records, excluding the reserved broker-list entry.
function getPartyEntries() {
  return Object.keys(parties).filter(k => k !== BROKERS_KEY).map(k => parties[k]);
}

// Brokers explicitly added via the "+ ADD NEW BROKER" option.
function getSavedBrokers() {
  return (parties[BROKERS_KEY] && parties[BROKERS_KEY].list) || [];
}

// Combined, de-duplicated broker list: brokers already used on any party + manually added ones.
function getAllBrokers() {
  const map = new Map();
  getPartyEntries().forEach(p => {
    if (p.brokerName) {
      const key = p.brokerName + '|' + (p.brokerMobile || '');
      if (!map.has(key)) map.set(key, { name: p.brokerName, mobile: p.brokerMobile || '' });
    }
  });
  getSavedBrokers().forEach(b => {
    const key = b.name + '|' + (b.mobile || '');
    if (!map.has(key)) map.set(key, b);
  });
  return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
}

function addNewBroker(name, mobile) {
  const list = getSavedBrokers().slice();
  list.push({ name: name.trim().toUpperCase(), mobile: mobile.trim() });
  parties[BROKERS_KEY] = { list };
  syncToStorage();
}

// Pulls broker names/mobiles already present on existing parties into the saved broker list,
// so every broker ever entered shows up in the picker (not just newly added ones).
function syncBrokersFromParties() {
  const saved = getSavedBrokers().slice();
  const existingKeys = new Set(saved.map(b => b.name + '|' + (b.mobile || '')));
  let changed = false;
  getPartyEntries().forEach(p => {
    if (p.brokerName) {
      const key = p.brokerName + '|' + (p.brokerMobile || '');
      if (!existingKeys.has(key)) {
        saved.push({ name: p.brokerName, mobile: p.brokerMobile || '' });
        existingKeys.add(key);
        changed = true;
      }
    }
  });
  if (changed) {
    parties[BROKERS_KEY] = { list: saved };
    syncToStorage();
  }
}

function syncToStorage() {
  isSaving = true;
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(parties)
  }).catch((e) => {
    console.error('Sync failed', e);
    showMsg('SAVE FAILED - CHECK INTERNET');
  }).finally(() => { isSaving = false; });
}

function showMsg(text) {
  msgArea.innerHTML = '<div class="msg">' + text + '</div>';
  setTimeout(() => { msgArea.innerHTML = ''; }, 2500);
}

function getExpiryDate(possessionDateStr) {
  const d = new Date(possessionDateStr);
  d.setMonth(d.getMonth() + 12);
  return d;
}

function formatDateDisplay(d) {
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

// Find which party (if any) already owns a given shop number.
// excludeKey lets edit-mode ignore the party currently being edited.
function findPartyKeyForShop(shopNo, excludeKey) {
  const upper = shopNo.toUpperCase();
  for (const key in parties) {
    if (key === BROKERS_KEY) continue;
    if (excludeKey && key === excludeKey) continue;
    const nums = parties[key].shopNumbers || [];
    if (nums.includes(upper)) return key;
  }
  return null;
}

function updateDashboardCounts() {
  const all = getPartyEntries();
  const securityPending = all.filter(p => p.securityDepositStatus === 'NO').length;
  const agreementPending = all.filter(p => p.agreementStatus === 'NO').length;
  const referencePending = all.filter(p => p.referenceFormStatus === 'NO').length;
  const possessionCount = all.filter(p => p.possessionDate).length;
  document.getElementById('numPossession').textContent = possessionCount;
  document.getElementById('numSecurity').textContent = securityPending;
  document.getElementById('numAgreement').textContent = agreementPending;
  document.getElementById('numReference').textContent = referencePending;
}

function shopsLabel(p) {
  return (p.shopNumbers || []).join(', ');
}

function openDashboardList(type) {
  const all = getPartyEntries();
  let title = '';
  let html = '';
  dashActionArea.innerHTML = '';

  if (type === 'possession') {
    title = 'POSSESSION EXPIRY (DATE WISE)';
    const withDate = all.filter(p => p.possessionDate).map(p => ({ p, expiry: getExpiryDate(p.possessionDate) }));
    withDate.sort((a, b) => a.expiry - b.expiry);

    if (!withDate.length) {
      html = '<p class="dash-sub-empty">NO POSSESSION DATE ADDED YET</p>';
    } else {
      const today = new Date();
      html = withDate.map(({ p, expiry }) => {
        const expired = expiry < today;
        return '<button class="result-item" data-key="' + (p.shopNumbers[0] || '') + '">' +
          '<div><div class="shop">' + shopsLabel(p) + '</div><div class="firm">' + (p.firmName || '\u2014') + ' &middot; POSSESSION: ' + p.possessionDate + '</div></div>' +
          '<span class="pill ' + (expired ? 'no' : 'yes') + '">' + (expired ? 'EXPIRED' : formatDateDisplay(expiry)) + '</span>' +
        '</button>';
      }).join('');

      // Entries whose expiry date falls in the current calendar month/year
      const today2 = new Date();
      const currentMonthList = withDate.filter(({ expiry }) =>
        expiry.getMonth() === today2.getMonth() && expiry.getFullYear() === today2.getFullYear()
      );

      if (currentMonthList.length) {
        const monthName = today2.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        dashActionArea.innerHTML =
          '<button class="pdf-btn" id="downloadPdfBtn">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3v13m0 0-4-4m4 4 4-4M4 21h16"/></svg>' +
            'DOWNLOAD ' + monthName.toUpperCase() + ' EXPIRY PDF (' + currentMonthList.length + ')' +
          '</button>';
        document.getElementById('downloadPdfBtn').onclick = () => downloadPossessionExpiryPdf(currentMonthList, monthName);
      }
    }
  } else {
    let filterFn;
    if (type === 'security') { filterFn = p => p.securityDepositStatus === 'NO'; title = 'SECURITY DEPOSIT PENDING'; }
    else if (type === 'agreement') { filterFn = p => p.agreementStatus === 'NO'; title = 'AGREEMENT PENDING'; }
    else if (type === 'reference') { filterFn = p => p.referenceFormStatus === 'NO'; title = 'REFERENCE FORM PENDING'; }

    const matches = all.filter(filterFn);
    if (!matches.length) {
      html = '<p class="dash-sub-empty">NONE PENDING</p>';
    } else {
      html = matches.map(p =>
        '<button class="result-item" data-key="' + (p.shopNumbers[0] || '') + '">' +
          '<div><div class="shop">' + shopsLabel(p) + '</div><div class="firm">' + (p.firmName || '\u2014') + '</div></div>' +
          '<span class="pill no">PENDING</span>' +
        '</button>'
      ).join('');
    }
  }

  dashTitle.textContent = title;
  dashListArea.innerHTML = html;
  dashListArea.querySelectorAll('.result-item').forEach(btn => {
    btn.onclick = () => {
      closeDashboard();
      searchInput.value = btn.dataset.key;
      renderSearch(btn.dataset.key);
    };
  });

  searchView.style.display = 'none';
  formView.style.display = 'none';
  dashboardView.style.display = 'block';
}

function downloadPossessionExpiryPdf(list, monthName) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });

  doc.setFontSize(16);
  doc.setTextColor(20, 20, 20);
  doc.text('RAGHUVIR SCARLETT - POSSESSION EXPIRY (' + monthName.toUpperCase() + ')', 40, 40);
  doc.setFontSize(10);
  doc.setTextColor(100, 100, 100);
  doc.text('Generated on ' + new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }), 40, 58);

  const rows = list
    .slice()
    .sort((a, b) => a.expiry - b.expiry)
    .map(({ p, expiry }) => [
      (p.shopNumbers || []).join(', '),
      p.firmName || '-',
      p.ownerName || '-',
      p.ownerMobile || '-',
      p.possessionDate || '-',
      formatDateDisplay(expiry)
    ]);

  doc.autoTable({
    startY: 72,
    head: [['SHOP NUMBERS', 'FIRM NAME', 'OWNER NAME', 'OWNER MOBILE', 'POSSESSION DATE', 'EXPIRY DATE']],
    body: rows,
    theme: 'grid',
    styles: { fontSize: 10, cellPadding: 6, valign: 'middle' },
    headStyles: { fillColor: [15, 23, 42], textColor: [251, 191, 36], fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [245, 245, 245] },
    margin: { left: 40, right: 40 }
  });

  doc.save('possession-expiry-' + monthName.replace(' ', '-').toLowerCase() + '.pdf');
}

function closeDashboard() {
  dashboardView.style.display = 'none';
  searchView.style.display = 'block';
}

function renderSearch(selectedShopNumber) {
  updateDashboardCounts();

  const q = searchInput.value.trim().toUpperCase();
  countText.textContent = getPartyEntries().length + ' PARTIES SAVED';

  const selectedPartyKey = selectedShopNumber ? findPartyKeyForShop(selectedShopNumber) : null;

  if (selectedPartyKey && parties[selectedPartyKey]) {
    currentViewKey = selectedShopNumber;

    const existingHistory = resultArea.querySelector('.history');
    const wasHistoryOpen = existingHistory ? existingHistory.open : false;

    resultArea.className = '';
    resultArea.innerHTML = renderCard(parties[selectedPartyKey]);

    const newHistory = resultArea.querySelector('.history');
    if (newHistory && wasHistoryOpen) newHistory.open = true;

    document.getElementById('editBtn').onclick = () => openForm(selectedPartyKey);
    resultArea.querySelectorAll('.h-delete-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        deleteHistoryEntry(btn.dataset.party, parseInt(btn.dataset.idx, 10));
      };
    });
    return;
  }

  currentViewKey = null;

  if (!q) {
    resultArea.className = 'empty';
    resultArea.innerHTML = '<p class="main">ENTER A SHOP NUMBER TO SEARCH</p><p class="sub">' + getPartyEntries().length + ' PARTIES SAVED</p>';
    return;
  }

  // Show one row per matching shop number (a party with several shops can appear multiple times,
  // each row still opens the same shared party card).
  const rowsData = [];
  getPartyEntries().forEach(p => {
    (p.shopNumbers || []).forEach(sn => {
      if (sn.toUpperCase().includes(q)) {
        rowsData.push({ shopNumber: sn, party: p });
      }
    });
  });

  if (rowsData.length === 0) {
    resultArea.className = 'empty';
    resultArea.innerHTML = '<p class="main">NO SHOP FOUND FOR "' + q + '"</p>';
    return;
  }

  resultArea.className = '';
  resultArea.innerHTML = rowsData.map(({ shopNumber, party }) =>
    '<button class="result-item" data-key="' + shopNumber + '">' +
      '<div><div class="shop">' + shopNumber + '</div><div class="firm">' + (party.firmName || '\u2014') +
        (party.shopNumbers.length > 1 ? ' &middot; ' + party.shopNumbers.length + ' SHOPS LINKED' : '') + '</div></div>' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' +
    '</button>'
  ).join('');

  resultArea.querySelectorAll('.result-item').forEach(btn => {
    btn.onclick = () => renderSearch(btn.dataset.key);
  });
}

// Updated cleanPhone function to return +91 prefix instead of 91
function cleanPhone(raw) {
  let digits = (raw || '').replace(/\D/g, '');
  if (digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
  if (digits.length === 10) digits = '+91' + digits;
  else if (digits.length === 12 && digits.startsWith('91')) digits = '+' + digits;
  else if (digits.length > 0 && !digits.startsWith('+')) digits = '+' + digits;
  return digits;
}

function deleteHistoryEntry(partyKey, idx) {
  const p = parties[partyKey];
  if (!p || !p.history || !p.history[idx]) return;
  if (!confirm('Ye purani history entry delete karni hai? Ye wapas nahi aayegi.')) return;
  p.history.splice(idx, 1);
  syncToStorage();
  renderSearch(currentViewKey);
}

function renderCard(p) {
  let rows = '';
  FIELD_DEFS.forEach(f => {
    const val = p[f.key];
    if (!val) return;
    if (f.type === 'bool') {
      const yes = val === 'YES';
      rows += '<div class="row"><span class="k">' + f.label + '</span><span class="pill ' + (yes ? 'yes' : 'no') + '">' + val + '</span></div>';
    } else if (f.type === 'phone') {
      const digits = cleanPhone(val);
      rows += '<div class="row phone-row">' +
        '<div class="top"><span class="k">' + f.label + '</span><span class="v">' + val + '</span></div>' +
        '<div class="phone-actions">' +
          '<a class="phone-btn call" href="tel:' + digits + '">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' +
            'CALL</a>' +
          '<a class="phone-btn whatsapp" href="https://wa.me/' + digits.replace('+', '') + '" target="_blank" rel="noopener">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.85 1h.01a7.94 7.94 0 0 0 5.54-13.58zm-5.55 12.2a6.57 6.57 0 0 1-3.35-.92l-.24-.14-2.5.65.67-2.43-.16-.25a6.6 6.6 0 1 1 12.24-3.5 6.57 6.57 0 0 1-6.66 6.59zm3.6-4.93c-.2-.1-1.17-.58-1.35-.64s-.31-.1-.44.1-.51.64-.62.77-.23.15-.42.05a5.4 5.4 0 0 1-2.7-2.36c-.2-.35.2-.32.58-1.08.06-.13.03-.24-.02-.34s-.44-1.06-.6-1.45c-.16-.38-.32-.33-.44-.34h-.38a.72.72 0 0 0-.52.25 2.2 2.2 0 0 0-.68 1.63c0 .96.7 1.89.8 2.02.1.13 1.38 2.1 3.34 2.95.47.2.83.32 1.11.41.47.15.9.13 1.24.08.38-.06 1.17-.48 1.33-.94s.16-.86.11-.94-.18-.13-.38-.23z"/></svg>' +
            'WHATSAPP</a>' +
        '</div>' +
      '</div>';
    } else {
      rows += '<div class="row"><span class="k">' + f.label + '</span><span class="v">' + val + '</span></div>';
    }
  });

  let historyHtml = '';
  if (p.history && p.history.length) {
    const entries = p.history.map((h, idx) => ({ h, idx })).slice().reverse().map(({ h, idx }) => {
      let hrows = '';
      FIELD_DEFS.forEach(f => {
        const v = h[f.key];
        if (!v) return;
        hrows += '<div class="h-row"><span class="k">' + f.label + '</span><span class="v">' + v + '</span></div>';
      });
      const hShops = (h.shopNumbers || []).join(', ');
      return '<div class="history-entry">' +
        '<div class="h-head">' +
          '<button type="button" class="h-delete-btn" data-party="' + p.partyId + '" data-idx="' + idx + '" title="Delete this old data">&#10005;</button>' +
          '<span class="h-title">OLD DATA - SHOP ' + hShops + ' (UPDATED ON ' + h.savedAt + ')</span>' +
        '</div>' + hrows + '</div>';
    }).join('');
    historyHtml = '<details class="history"><summary>&#9662; VIEW OLD / PREVIOUS DATA (' + p.history.length + ')</summary>' + entries + '</details>';
  }

  return (
    '<div class="card">' +
      '<div class="card-head">' +
        '<div><div class="label">SHOP NUMBERS</div><div class="shopnum-list">' +
          (p.shopNumbers || []).map(s => '<span class="shopnum-chip">' + s + '</span>').join('') +
        '</div></div>' +
        '<button class="update-btn" id="editBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>UPDATE</button>' +
      '</div>' +
      '<div>' + rows + '</div>' +
    '</div>' + historyHtml
  );
}

// --- Broker picker ---

function setupBrokerPicker() {
  const input = document.getElementById('f_brokerName');
  if (!input) return;
  input.addEventListener('focus', () => renderBrokerDropdown(input.value));
  input.addEventListener('input', () => renderBrokerDropdown(input.value));
}

function renderBrokerDropdown(filterText) {
  const dropdown = document.getElementById('brokerDropdown');
  if (!dropdown) return;
  const q = (filterText || '').trim().toUpperCase();
  const brokers = getAllBrokers().filter(b => !q || b.name.includes(q));

  let html = '<div class="broker-add-row" id="brokerAddRow"><span class="plus-circle">+</span> ADD NEW BROKER</div>';
  if (!brokers.length) {
    html += '<div class="broker-empty">KOI SAVED BROKER NAHI MILA</div>';
  } else {
    html += brokers.map(b =>
      '<div class="broker-item" data-name="' + b.name.replace(/"/g, '&quot;') + '" data-mobile="' + (b.mobile || '').replace(/"/g, '&quot;') + '">' +
        '<div class="b-name">' + b.name + '</div>' +
        (b.mobile ? '<div class="b-mobile">' + b.mobile + '</div>' : '') +
      '</div>'
    ).join('');

  dropdown.innerHTML = html;
  dropdown.style.display = 'block';

  const addRow = document.getElementById('brokerAddRow');

function renderAddBrokerForm() {

      '<input type="text" id="newBrokerName" placeholder="BROKER NAME" autocomplete="off">' +

      '</div>' +

// Close the broker dropdown when tapping anywhere outside it.
document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('brokerDropdown');
  const picker = document.getElementById('brokerPicker');
  if (dropdown && dropdown.style.display === 'block' && picker && !picker.contains(e.target)) {
    dropdown.style.display = 'none';
  }

function addShopChip(raw) {
  const sn = raw.trim().toUpperCase();
  if (!sn) return;
  if (!formShopNumbers.includes(sn)) formShopNumbers.push(sn);
  renderShopChips();
}

function removeShopChip(sn) {
  formShopNumbers = formShopNumbers.filter(s => s !== sn);
  renderShopChips();
}

function renderShopChips() {
  const list = document.getElementById('shopChipList');
  const saveBtn = document.getElementById('saveBtn');
  list.innerHTML = formShopNumbers.map(sn =>
    '<span class="edit-chip">' + sn + '<button type="button" data-sn="' + sn + '" title="Remove">&#10005;</button></span>'
  ).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => removeShopChip(btn.dataset.sn);
  });

  const conflict = formShopNumbers.find(sn => findPartyKeyForShop(sn, editingKey));
  if (conflict) {
    formErr.innerHTML = '<div class="err">SHOP ' + conflict + ' ALREADY LINKED TO ANOTHER PARTY. USE UPDATE ON THAT PARTY INSTEAD.</div>';
    saveBtn.disabled = true;
    saveBtn.style.opacity = '0.6';
  } else {
    formErr.innerHTML = '';
    saveBtn.disabled = false;
    saveBtn.style.opacity = '1';
  }
}

function updateBoolButtons(field, val) {
  partyForm.querySelectorAll('.bool-btn[data-field="' + field + '"]').forEach(b => {
    b.classList.remove('active-yes', 'active-no');
    if (b.dataset.val === val) {
      b.classList.add(val === 'YES' ? 'active-yes' : 'active-no');
    }
  });
  partyForm.dataset['sel_' + field] = val;
}

function closeForm() {
  searchView.style.display = 'block';
  formView.style.display = 'none';
  renderSearch();
}

partyForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const shopAddInput = document.getElementById('f_shopAdd');
  if (shopAddInput.value.trim()) { addShopChip(shopAddInput.value); shopAddInput.value = ''; }
  const shopNumbers = formShopNumbers.slice();

  if (!shopNumbers.length) {
    formErr.innerHTML = '<div class="err">AT LEAST ONE SHOP NUMBER IS REQUIRED.</div>';
    return;
  }

  const conflict = shopNumbers.find(sn => findPartyKeyForShop(sn, editingKey));
  if (conflict) {
    formErr.innerHTML = '<div class="err">SHOP ' + conflict + ' ALREADY LINKED TO ANOTHER PARTY. USE UPDATE ON THAT PARTY INSTEAD.</div>';
    return;
  }
  formErr.innerHTML = '';

  const partyKey = editingKey || generatePartyId();
  const record = { partyId: partyKey, shopNumbers };
  FIELD_DEFS.forEach(f => {
    if (f.type === 'bool') {
      record[f.key] = partyForm.dataset['sel_' + f.key] || 'NO';
    } else {
      const el = document.getElementById('f_' + f.key);
      record[f.key] = el.value.trim().toUpperCase();
    }
  });

  const existing = editingKey ? parties[editingKey] : null;
  if (existing) {
    const oldSnapshot = {};
    FIELD_DEFS.forEach(f => { oldSnapshot[f.key] = existing[f.key]; });
    oldSnapshot.shopNumbers = existing.shopNumbers;
    oldSnapshot.savedAt = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    record.history = (existing.history || []).concat([oldSnapshot]);
  } else {
    record.history = [];
  }

  parties[partyKey] = record;
  syncToStorage();

  const wasEdit = !!editingKey;
  editingKey = null;
  formShopNumbers = [];
  closeForm();
  const firstShop = shopNumbers[0];
  searchInput.value = firstShop;
  showMsg((wasEdit ? 'PARTY UPDATED (' : 'PARTY SAVED (') + shopNumbers.join(', ') + ')');
  renderSearch(firstShop);
});

document.getElementById('addFab').onclick = () => openForm(null);
document.getElementById('backBtn').onclick = closeForm;
document.getElementById('dashBackBtn').onclick = closeDashboard;
document.getElementById('boxPossession').onclick = () => openDashboardList('possession');
document.getElementById('boxSecurity').onclick = () => openDashboardList('security');
document.getElementById('boxAgreement').onclick = () => openDashboardList('agreement');
document.getElementById('boxReference').onclick = () => openDashboardList('reference');
searchInput.addEventListener('input', () => renderSearch());

loadData();
</script>
</body>
</html>
